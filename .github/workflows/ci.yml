name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Enforce lib/ line-coverage gate (>= 60%)
        run: |
          python3 - <<'PYEOF'
          import re, sys
          data = open('coverage/lcov.info').read()
          lines = [(c) for _, c in re.findall(r'^DA:(\d+),(\d+)$', data, re.M)]
          hit = sum(1 for c in lines if int(c) > 0)
          pct = 100 * hit / len(lines) if lines else 0
          print(f'lib/ line coverage: {hit}/{len(lines)} = {pct:.0f}%')
          sys.exit(0 if pct >= 60 else 1)
          PYEOF
      - run: flutter pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: ./gradlew testDebugUnitTest
        working-directory: android

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake libgtk-3-dev libgdk-pixbuf-2.0-dev libglib2.0-dev ninja-build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: pod lib lint
        working-directory: ios
      - run: flutter build ios --no-codesign
