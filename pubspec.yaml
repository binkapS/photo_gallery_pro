name: photo_gallery_pro
description: "A Flutter plugin for accessing photos and videos from the device gallery. Supports Android, iOS, and Linux with a typed Dart API."
version: 0.1.0
homepage: https://binkap.com/packages/photo_gallery_pro
repository: https://github.com/binkapS/photo_gallery_pro
issue_tracker: https://github.com/binkapS/photo_gallery_pro/issues
documentation: https://github.com/binkapS/photo_gallery_pro/blob/main/README.md
topics:
  - gallery
  - photos
  - videos
  - media
  - camera-roll

environment:
  sdk: ^3.7.2
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.binkap.photo_gallery_pro
        pluginClass: PhotoGalleryProPlugin
      ios:
        pluginClass: PhotoGalleryProPlugin
      linux:
        pluginClass: PhotoGalleryProPlugin
